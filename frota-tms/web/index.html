<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meu roteiro" />
    <title>FrotaTMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-loading {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        font-family: Figtree, system-ui, sans-serif;
        background: #f6f6f4;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #0c0c0c;
          color: #f5f5f5;
        }
        #app-loading .hint {
          color: #a3a3a3;
        }
        #app-loading .spinner {
          border-color: #262626;
          border-top-color: #2dd4bf;
        }
      }
      #app-loading .spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid #e4e4e0;
        border-top-color: #0f766e;
        border-radius: 50%;
        animation: app-load-spin 0.75s linear infinite;
      }
      #app-loading .title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      #app-loading .hint {
        margin: 0;
        max-width: 18rem;
        text-align: center;
        font-size: 0.8125rem;
        line-height: 1.45;
        color: #6b6b66;
      }
      @keyframes app-load-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading" role="status" aria-live="polite" aria-busy="true">
        <div class="spinner" aria-hidden="true"></div>
        <p class="title">Carregando FrotaTMS…</p>
        <p class="hint">Se aparecer a tela preta do Render, aguarde até 1 minuto — o servidor está acordando.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
