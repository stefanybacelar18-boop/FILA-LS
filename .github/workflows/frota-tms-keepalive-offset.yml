name: FrotaTMS Keep Alive (offset)

# Complementa o keep-alive principal (:00, :15, :30, :45) com rajadas em :07, :22, :37, :52.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: frota-tms-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rajada de pings (offset)
        env:
          HEALTH_URL: ${{ vars.FROTA_TMS_HEALTH_URL || 'https://frota-tms.onrender.com/api/health' }}
          BASE_URL: ${{ vars.FROTA_TMS_BASE_URL || 'https://frota-tms.onrender.com' }}
          KEEPALIVE_ROUNDS: '5'
          KEEPALIVE_INTERVAL_SEC: '150'
        run: |
          chmod +x frota-tms/scripts/render-keepalive.sh
          frota-tms/scripts/render-keepalive.sh
