name: Cortely CI

on:
  pull_request:
    paths:
      - "cortely/**"
      - ".github/workflows/cortely-ci.yml"
  push:
    branches: [main, "cursor/**"]
    paths:
      - "cortely/**"
      - ".github/workflows/cortely-ci.yml"

defaults:
  run:
    working-directory: cortely

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortely/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security phase 0 tests
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          CORTELY_OWNER_PASSWORD: ownerpass123
          CORTELY_RECEPTION_PASSWORD: reception123
          CORTELY_BARBER_PASSWORD: barberpass123
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/security-phase0.ts

      - name: Security fase 1.A tests
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          CORTELY_OWNER_PASSWORD: ownerpass123
          CORTELY_RECEPTION_PASSWORD: reception123
          CORTELY_BARBER_PASSWORD: barberpass123
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/security-fase1a.ts

      - name: Install PostgreSQL (RLS SQL isolation)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql postgresql-client
          sudo pg_ctlcluster 16 main start || sudo service postgresql start
          sudo -u postgres psql -c 'SELECT 1'

      - name: Security fase 1.A RLS SQL isolation (two tenants)
        env:
          CORTELY_RLS_TEST_DB: cortely_fase1a_rls_test
        run: npx tsx scripts/security-fase1a-rls-sql.ts

      - name: Production build
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build
