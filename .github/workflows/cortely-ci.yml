name: Cortely CI

on:
  pull_request:
    paths:
      - "cortely/**"
      - ".github/workflows/cortely-ci.yml"
  push:
    branches: [main, "cursor/**"]
    paths:
      - "cortely/**"
      - ".github/workflows/cortely-ci.yml"

defaults:
  run:
    working-directory: cortely

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cortely/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck scripts
        run: npx tsc --noEmit -p tsconfig.scripts.json

      - name: Security phase 0 tests
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          CORTELY_OWNER_PASSWORD: ownerpass123
          CORTELY_RECEPTION_PASSWORD: reception123
          CORTELY_BARBER_PASSWORD: barberpass123
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/security-phase0.ts

      - name: Security fase 1.A tests
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          CORTELY_OWNER_PASSWORD: ownerpass123
          CORTELY_RECEPTION_PASSWORD: reception123
          CORTELY_BARBER_PASSWORD: barberpass123
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/security-fase1a.ts

      - name: Install psql client
        working-directory: .
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq && \
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client && \
              break
            echo "apt retry $i…"
            sleep $((i * 8))
          done
          psql --version

      - name: Security fase 1.A RLS SQL isolation (two tenants)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_RLS_TEST_DB: cortely_fase1a_rls_test
        run: npx tsx scripts/security-fase1a-rls-sql.ts

      - name: Security fase 1.B.0 registry tests
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/security-fase1b0.ts

      - name: Security fase 1.B.0 registry SQL (CHECK + grants)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_REGISTRY_TEST_DB: cortely_fase1b0_registry_test
        run: npx tsx scripts/security-fase1b0-registry-sql.ts

      - name: Security fase 1.B.1 products/stock (SQL + adapters)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
          CORTELY_FASE1B1_TEST_DB: cortely_fase1b1_stock_test
        run: npx tsx scripts/security-fase1b1-products-stock.ts

      - name: Security fase 1.B.1 ops route regression
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          CORTELY_OWNER_PASSWORD: ownerpass123
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/security-fase1b1-ops-route-regression.ts

      - name: Security fase 1.B.2 cash (SQL + adapters)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
          CORTELY_FASE1B2_TEST_DB: cortely_fase1b2_cash_test
          CORTELY_FASE1B2_ORPHAN_DB: cortely_fase1b2_orphan_test
        run: npx tsx scripts/security-fase1b2-cash.ts

      - name: Security fase 1.B.3-G gateway isolado
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          NODE_ENV: test
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
          CORTELY_ENABLE_FAKE_PAYMENT_PROVIDER: "true"
          CORTELY_FAKE_PAYMENT_SECRET: cortely-fake-test-secret
          CORTELY_FASE1B3G_TEST_DB: cortely_fase1b3g_gateway_test
        run: npx tsx scripts/security-fase1b3g-gateway.ts

      - name: Security fase 1.B.4 commissions (SQL + adapters)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
          CORTELY_FASE1B4_TEST_DB: cortely_fase1b4_commissions_test
        run: npx tsx scripts/security-fase1b4-commissions.ts

      - name: Security fase 1.B.5 packages (SQL + adapters)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
          CORTELY_FASE1B5_TEST_DB: cortely_fase1b5_packages_test
        run: npx tsx scripts/security-fase1b5-packages.ts

      - name: Security fase 1.B.6 purchasing/payables (SQL + adapters)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
          CORTELY_FASE1B6_TEST_DB: cortely_fase1b6_purchasing_test
        run: npx tsx scripts/security-fase1b6-purchasing.ts

      - name: Production build
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build

      - name: Smoke fase 1.B.0/1.B.1 boot fail-fast (next start)
        env:
          CORTELY_SESSION_SECRET: ci-session-secret-at-least-16-chars
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npx tsx scripts/smoke-fase1b0-boot.ts
